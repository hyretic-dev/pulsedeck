name: CI

on:
  push:
    branches: [main]
  pull_request:

# Backend-Tests laufen gegen ein echtes PostgreSQL (pgvector-Image wie im Compose-Stack).
# Die DB-Tests erwarten den Test-Container auf Port 5433 (backend/scripts/test-db-setup.mjs).
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, website]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-compose.sh
      - run: bash scripts/smoke-compose.sh
      - name: Smoke der Coolify-Variante
        run: SMOKE_COMPOSE_FILE=docker-compose.coolify.yml SMOKE_PORT=18097 bash scripts/smoke-compose.sh

  # Echte Oberfläche im Headless-Browser gegen den Compose-Stack (e2e/README.md).
  browser-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend, website]
    env:
      E2E_PORT: 18095
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stack starten (Mail-Transport log, keine künstliche Wartezeit)
        run: |
          cat > "$RUNNER_TEMP/e2e.env" <<ENV
          POSTGRES_PASSWORD=$(openssl rand -hex 12)
          POSTGRES_MIGRATIONS_PASSWORD=$(openssl rand -hex 12)
          POSTGRES_RUNTIME_PASSWORD=$(openssl rand -hex 12)
          JWT_SECRET=$(openssl rand -hex 32)
          JWT_ISSUER=pulsedeck
          JWT_AUDIENCE=pulsedeck-web
          APP_BASE_URL=http://localhost:${E2E_PORT}
          FRONTEND_PORT=${E2E_PORT}
          AUTH_MIN_RESPONSE_MS=0
          ENV
          docker compose -p pulsedeck-e2e --env-file "$RUNNER_TEMP/e2e.env" up -d --build --wait
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: node browser-smoke.mjs
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:${{ env.E2E_PORT }}
          E2E_COMPOSE: docker compose -p pulsedeck-e2e --env-file ${{ runner.temp }}/e2e.env
      - if: always()
        run: docker compose -p pulsedeck-e2e --env-file "$RUNNER_TEMP/e2e.env" down -v
