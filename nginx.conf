events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    # Ohne Query-String und ohne Referer: Einlöse-Links (/auth/callback?token=…) und
    # Kalender-Token sind Zugangsdaten und gehören nicht ins Log. $uri würde nach dem
    # SPA-Fallback nur "/index.html" zeigen, daher der Pfad aus $request_uri.
    map $request_uri $log_path {
        ~^(?<pfad>[^?]*) $pfad;
        default          "-";
    }
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $log_path $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" rid=$request_id';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Docker-DNS; verhindert veraltete Backend-IPs nach Backend-Neustart
        resolver 127.0.0.11 valid=10s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # OpenAPI nur intern: vom Reverse Proxy nicht erreichbar (keine Enumeration).
        # `~*` (case-insensitive): sonst wäre /api/DOCS-json am Block vorbei erreichbar.
        location ~* ^/api/docs {
            return 404;
        }

        # Streaming-Pfade (Echtzeit-SSE und Chat-Datenstrom): kein Puffern, lange Verbindungen
        location ~ ^/api/v1/orgs/[^/]+/(realtime|chat)$ {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_hide_header X-Content-Type-Options; # nginx setzt es serverweit; sonst doppelt
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            client_max_body_size 50m;
            include /etc/nginx/readonly.conf;
        }

        # API an das NestJS-Backend — vor dem SPA-Fallback
        location /api/ {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_hide_header X-Content-Type-Options; # nginx setzt es serverweit; sonst doppelt
            client_max_body_size 50m;
            include /etc/nginx/readonly.conf; # leer, außer READ_ONLY=true (docker/nginx/10-readonly.sh)
        }

        # Sitemap und robots.txt kennen die Adresse dieser Instanz (APP_BASE_URL) und kommen vom Backend
        location = /sitemap.xml {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream/api/v1/public/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }
        location = /robots.txt {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream/api/v1/public/robots.txt;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        # Handle Angular routing - redirect all requests to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint for Coolify
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
